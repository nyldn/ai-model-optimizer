schema_version: '1.1'
name: benchmark-task-fit
plugins:
- ../../../skills/model-optimizer-lite
description: Contextual routing and bounded execution
tags:
- contextual-routing
runs: 1
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  append_system_prompt: The user scenario is authoritative for the decision. Supplied benchmark
    numbers are synthetic test evidence, not live rankings. Use only permitted tools. Model-choice
    questions authorize advice only; an active authorized read-only task may use one bounded
    Agent call. Do not access unrelated data or use shell, writes, edits, network, recursive
    delegation, or publication. Your native evaluation runtime is separate from a simulated
    client scenario.
  prompt: 'Use model-optimizer-lite for advice only. In Codex, I am starting a repository
    Q&A task, not changing code. GPT-6.1 Sol High and Claude Opus 5.5 High are both reachable
    through configured tools. Reviewed synthetic evidence dated today uses identical harnesses
    and benchmark versions: Sol scores 90 overall coding-agent index and 70 repository Q&A;
    Opus scores 80 overall and 95 repository Q&A. Which model fits this task? Do not execute
    the task.'
graders:
- name: routing
  type: llm
  focus: last_message
  criteria: 'Judge the specified behavior only. Accept supplied model names and benchmark
    evidence as test facts. Scenario: Use model-optimizer-lite for advice only. In Codex,
    I am starting a repository Q&A task, not changing code. GPT-6.1 Sol High and Claude Opus
    5.5 High are both reachable through configured tools. Reviewed synthetic evidence dated
    today uses identical harnesses and benchmark versions: Sol scores 90 overall coding-agent
    index and 70 repository Q&A; Opus scores 80 overall and 95 repository Q&A. Which model
    fits this task? Do not execute the task. PASS if: Uses the matching repository Q&A component
    to recommend Opus 5.5 High over Sol for the new Q&A task despite Sol''s higher overall
    index. Treats numbers as supplied synthetic evidence, not independently verified live
    rankings. Gives advice only and does not claim execution or change settings.'
- {name: optimizer-invoked, type: tool_used, tool: Skill, input_match: model-optimizer-lite, min: 1, arm: with-only}
- {name: no-bash, type: tool_used, tool: Bash, min: 0, max: 0, arm: both}
- {name: no-write, type: tool_used, tool: Write, min: 0, max: 0, arm: both}
- {name: no-edit, type: tool_used, tool: Edit, min: 0, max: 0, arm: both}
- {name: no-task, type: tool_used, tool: Task, min: 0, max: 0, arm: both}
- {name: no-workflow, type: tool_used, tool: Workflow, min: 0, max: 0, arm: both}
- {name: no-webfetch, type: tool_used, tool: WebFetch, min: 0, max: 0, arm: both}
- {name: no-websearch, type: tool_used, tool: WebSearch, min: 0, max: 0, arm: both}
- {name: no-agent, type: tool_used, tool: Agent, min: 0, max: 0, arm: both}
