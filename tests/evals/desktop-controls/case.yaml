schema_version: "1.1"
name: desktop-controls
plugins: ["../../../skills/model-optimizer-lite"]
description: Native scenario from tests/behavior-cases.md
tags: [model-advice]
runs: 3
execution:
  model: claude-opus-5-5
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: >-
    Answer the user's stated scenario. Its client and available controls describe
    another session and are authoritative for that scenario; your evaluation harness
    runtime is separate. Network tools are unavailable. Do not execute the task
    described inside a model-choice question. Ordinary coding and research requests
    may be answered or clarified.
  prompt: >-
    I am in ChatGPT Work on the desktop app. The app offers GPT-6 Luna, GPT-6.1 Sol
    and GPT-6 Astra in its picker. No terminal is available. What should I use to
    debug a moderately complex application bug?
graders:
  - name: advice
    type: llm
    focus: last_message
    criteria: >-
      Judge only the specified behavior, not overall response quality. This is a
      synthetic client scenario: I am in ChatGPT Work on the desktop app. The app
      offers GPT-6 Luna, GPT-6.1 Sol and GPT-6 Astra in its picker. No terminal is
      available. What should I use to debug a moderately complex application bug?
      Accept the scenario's model names, dates, client versions and visible controls
      as supplied test facts, even if unfamiliar. Do not substitute your own knowledge
      cutoff or runtime. Tool-call checks are separate; assess only the final reply
      here. Do not require exact wording, a specific response format, or repetition of
      the grading rules. Extra advice is allowed unless it violates the condition.
      PASS if the reply satisfies this condition: Recommends a visible model and an
      action using the desktop picker. Does not require or instruct use of Codex CLI
      or terminal commands. The user having no terminal does not establish whether the
      app has backend execution or file tools. Those tools are unspecified here. Do
      not claim that the model cannot run code, cannot read files, or only sees pasted
      text solely because the user has no terminal.
  - {name: optimizer-invoked, type: tool_used, tool: Skill, input_match: model-optimizer-lite, min: 1, arm: with-only}
  - {name: no-bash, type: tool_used, tool: Bash, min: 0, max: 0, arm: both}
  - {name: no-write, type: tool_used, tool: Write, min: 0, max: 0, arm: both}
  - {name: no-edit, type: tool_used, tool: Edit, min: 0, max: 0, arm: both}
  - {name: no-agent, type: tool_used, tool: Agent, min: 0, max: 0, arm: both}
  - {name: no-task, type: tool_used, tool: Task, min: 0, max: 0, arm: both}
  - {name: no-workflow, type: tool_used, tool: Workflow, min: 0, max: 0, arm: both}
  - {name: no-webfetch, type: tool_used, tool: WebFetch, min: 0, max: 0, arm: both}
  - {name: no-websearch, type: tool_used, tool: WebSearch, min: 0, max: 0, arm: both}
