name: Bug report
description: Report a problem with the Model Optimizer Lite skill.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should ChatGPT, Codex, or Claude have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the request, whether the skill was invoked directly, and relevant non-secret context.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App or client, model if visible, OS, and any relevant non-secret configuration.
    validations:
      required: false
